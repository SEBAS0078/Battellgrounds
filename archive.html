<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- When you change code or styles, bump ?v= here and in index.html and season.html -->
    <link href="style.css?v=3" rel="stylesheet" type="text/css" />
    <title>Battellgrounds Archive</title>
  </head>

  <body data-page="archive" class="subpage">
    <nav>
      <a href="index.html" class="nav-bar">Current Season</a>
      <a href="archive.html" class="nav-bar">Archive</a>
    </nav>

    <div class="header">
      <img id="cup-logo" src="assets/Battell.jpg" alt="Logo">
      <h1 class="header-text">Battellgrounds Archive</h1>
    </div>

    <section id="about">
      <h4>
        Every season of Battellgrounds, preserved. Pick a year to see its events,
        final standings, floor RAs, and the floor that took home the New Battell Cup.
      </h4>
    </section>

    <section id="plaque">
      <h2>The Perpetual Plaque</h2>
      <div class="plaque">
        <p class="plaque-title">Battellgrounds Champions</p>
        <div class="plaque-slots" id="plaque-slots"></div>
      </div>
    </section>

    <section>
      <h2>Past Seasons</h2>
      <div id="seasons-container" class="season-list"></div>
    </section>

    <script type="module" src="js/app.js?v=3"></script>
  </body>
</html>
