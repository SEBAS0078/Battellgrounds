<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- When you change code or styles, bump ?v= here and in index.html and archive.html -->
    <link href="style.css?v=3" rel="stylesheet" type="text/css" />
    <title>Battellgrounds Season</title>
  </head>

  <body data-page="season" class="subpage">
    <nav>
      <a href="index.html" class="nav-bar">Current Season</a>
      <a href="archive.html" class="nav-bar">Archive</a>
      <a href="#standings" class="nav-bar">Standings</a>
      <a href="#events" class="nav-bar">Events</a>
      <a href="#gallery" class="nav-bar">Gallery</a>
      <a href="#scoring" class="nav-bar">Rules</a>
    </nav>

    <div class="header">
      <img id="cup-logo" src="assets/Battell.jpg" alt="Logo">
      <h1 class="header-text" id="season-heading">Battellgrounds</h1>
      <p class="season-tagline" id="season-tagline"></p>
    </div>

    <section id="champion"></section>

    <section id="standings">
      <h2 id="standings-heading">Final Standings</h2>
      <div id="standings-list" class="standings"></div>
    </section>

    <section id="events">
      <h2>Events</h2>
      <p class="season-meta" id="events-summary"></p>
      <div id="season-events" class="archive-events"></div>
    </section>

    <!-- Gallery (appears once the season has photos) -->
    <section id="gallery" class="gallery-section" hidden>
      <h2>Gallery</h2>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>

    <section id="scoring">
      <h2>How Points Worked</h2>
      <p class="section-intro" id="scoring-intro"></p>
      <div class="rules" id="scoring-body"></div>
    </section>

    <section id="record-notes" hidden>
      <h3>About this record</h3>
      <ul class="record-notes" id="record-notes-list"></ul>
    </section>

    <p class="back-link"><a href="archive.html">← Back to all seasons</a></p>

    <script type="module" src="js/app.js?v=3"></script>
  </body>
</html>
